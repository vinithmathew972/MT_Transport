<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Owner Login - Mother Theresa Transport</title>
  <link rel="stylesheet" href="/static/css/login.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%230ea5e9'><path d='M1 3h15v13H1z'/><path d='M16 8h4l3 3v5h-7V8z'/><circle cx='5.5' cy='18.5' r='2.5'/><circle cx='18.5' cy='18.5' r='2.5'/></svg>">
</head>
<body>

  <div class="login-card-container">
    
    <!-- Branding Header -->
    <div class="login-header">
      <div class="login-logo-badge">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="1" y="3" width="15" height="13"></rect>
          <polygon points="16 8 20 8 23 11 23 16 16 16 16 8"></polygon>
          <circle cx="5.5" cy="18.5" r="2.5"></circle>
          <circle cx="18.5" cy="18.5" r="2.5"></circle>
        </svg>
      </div>
      <h1 class="brand-name">Mother Theresa <span>Transport</span></h1>
      <p class="brand-tagline-sub">Safe Journey... Stronger Tomorrow...</p>
    </div>

    <!-- Alert Box -->
    <div id="alertBox" class="alert-box"></div>

    <!-- Login Form -->
    <form id="loginForm" autocomplete="off">
      
      <div class="form-group">
        <label for="usernameInput" class="form-label">Owner Username</label>
        <div class="input-wrapper">
          <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
          <input 
            type="text" 
            id="usernameInput" 
            class="form-control" 
            placeholder="Enter username" 
            required 
            autofocus
          />
        </div>
      </div>

      <div class="form-group">
        <label for="passwordInput" class="form-label">Password</label>
        <div class="input-wrapper">
          <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          <input 
            type="password" 
            id="passwordInput" 
            class="form-control" 
            placeholder="••••••••" 
            required 
          />
          <button type="button" class="toggle-password-btn" id="togglePasswordBtn" title="Show / Hide Password">
            <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">
        <span class="btn-spinner" id="btnSpinner"></span>
        <span id="btnText">Secure Owner Login</span>
      </button>

    </form>

    <a href="/" class="back-link">&larr; Return to Home</a>

  </div>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/login.js"></script>
</body>
</html>
